<!DOCTYPE html>


<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>OMDB Watchlist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
    <div class="header-text">
        <h1>Find your film</h1>
        <a href="https://example.com">My Watchlist</a>
    </div>
    <div class="search-container">
        <form>
            <input type="search" name="search" id="search" class="search" placeholder="Search for a movie!">
        </form>
        <button form="search" id="search-button" class="search-button">Search</button>
    </div>
</header>
<script src="index.js"></script>
</body>
</html>
