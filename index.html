<!DOCTYPE html>


<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>OMDB Watchlist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
</head>
<body>
<header class="header">
    <div class="header-text">
        <h1>Find your film</h1>
        <a href="https://example.com">My Watchlist</a>
    </div>
    <div class="search-container">
        <form class="search-form">
            <img src="./images/search.svg" alt="search icon" class="search-icon">
            <input type="search" name="search" id="search" class="search" placeholder="Search for a movie!">
        </form>
        <button form="search" id="search-button" class="search-button">Search</button>
    </div>
</header>
<main id="results" class="results">
    <div class="movie-card">
        <img class="poster" alt="grave of the fireflies poster"
             src="https://m.media-amazon.com/images/M/MV5BNTY5MmE2OGMtN2IxNC00MDY4LTkwMGEtZDUzOTYyNWE0ZTNjXkEyXkFqcGc@._V1_QL75_UX380_CR0,4,380,562_.jpg">
        <div class="movie-info">
            <div class="movie-heading">
                <h3 class="movie-title">Grave of the Fireflies</h3>
                <span class="movie-rating">⭐ 5.0</span>
            </div>
            <div class="movie-meta-data">
                <span class="runtime">89 min</span>
                <span class="genre">Drama/War</span>
                <button class="add-watchlist">
                    <img src="./images/add.svg" alt="add watchlist icon">
                    Watchlist
                </button>
            </div>
            <p class="movie-plot">A young boy and his little sister struggle to survive in Japan during World War
                II.</p>
        </div>
    </div>
    <!--    <div class="empty-placeholder">-->
    <!--        <img src="./images/film.svg" alt="film icon" class="film-icon">-->
    <!--        <p>Start Exploring</p>-->
    <!--    </div>-->
</main>
<script src="index.js"></script>
</body>
</html>
